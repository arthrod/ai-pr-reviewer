name: 'AI-based PR Reviewer & Summarizer with Chat Capabilities'
description: 'AI-based PR Reviewer & Summarizer with Chat Capabilities'
branding:
  icon: 'git-merge'
  color: 'orange'
author: 'Cicero'
inputs:
  debug:
    required: false
    description: 'Enable debug mode'
    default: 'false'
  max_files:
    required: false
    description:
      'Max files to summarize and review. Less than or equal to 0 means no
      limit.'
    default: '150'
  review_simple_changes:
    required: false
    description: 'Review even when the changes are simple'
    default: 'false'
  review_comment_lgtm:
    required: false
    description: 'Leave comments even if the patch is LGTM'
    default: 'false'
  path_filters:
    required: false
    description: |
      The path filters, e.g., "src/**.py", "!dist/**", each line will be considered as one pattern.
      See also

      - https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
      - https://github.com/isaacs/minimatch
    default: |
      !dist/**
      !**/*.app
      !**/*.bin
      !**/*.bz2
      !**/*.class
      !**/*.db
      !**/*.csv
      !**/*.tsv
      !**/*.dat
      !**/*.dll
      !**/*.dylib
      !**/*.egg
      !**/*.glif
      !**/*.gz
      !**/*.xz
      !**/*.zip
      !**/*.7z
      !**/*.rar
      !**/*.zst
      !**/*.ico
      !**/*.jar
      !**/*.tar
      !**/*.war
      !**/*.lo
      !**/*.log
      !**/*.mp3
      !**/*.wav
      !**/*.wma
      !**/*.mp4
      !**/*.avi
      !**/*.mkv
      !**/*.wmv
      !**/*.m4a
      !**/*.m4v
      !**/*.3gp
      !**/*.3g2
      !**/*.rm
      !**/*.mov
      !**/*.flv
      !**/*.iso
      !**/*.swf
      !**/*.flac
      !**/*.nar
      !**/*.o
      !**/*.ogg
      !**/*.otf
      !**/*.p
      !**/*.pdf
      !**/*.doc
      !**/*.docx
      !**/*.xls
      !**/*.xlsx
      !**/*.ppt
      !**/*.pptx
      !**/*.pkl
      !**/*.pickle
      !**/*.pyc
      !**/*.pyd
      !**/*.pyo
      !**/*.pub
      !**/*.pem
      !**/*.rkt
      !**/*.so
      !**/*.ss
      !**/*.eot
      !**/*.exe
      !**/*.pb.go
      !**/*.lock
      !**/*.ttf
      !**/*.yaml
      !**/*.yml
      !**/*.cfg
      !**/*.toml
      !**/*.ini
      !**/*.mod
      !**/*.sum
      !**/*.work
      !**/*.json
      !**/*.mmd
      !**/*.svg
      !**/*.jpeg
      !**/*.jpg
      !**/*.png
      !**/*.gif
      !**/*.bmp
      !**/*.tiff
      !**/*.webm
      !**/*.woff
      !**/*.woff2
      !**/*.dot
      !**/*.md5sum
      !**/*.wasm
      !**/*.snap
      !**/*.parquet
      !**/gen/**
      !**/_gen/**
      !**/generated/**
      !**/@generated/**
      !**/vendor/**
      !**/*.min.js
      !**/*.min.js.map
      !**/*.min.js.css
      !**/*.tfstate
      !**/*.tfstate.backup
  disable_review:
    required: false
    description: 'Only provide the summary and skip the code review.'
    default: 'false'
  disable_release_notes:
    required: false
    description: 'Disable release notes'
    default: 'false'
  gemini_api_key:
    required: false
    description: 'The Google Gemini API key.'
    default: ''
  gemini_light_model:
    required: false
    description:
      'Model to use for simple tasks like summarizing diff on a file.'
    default: 'gemini-3.1-pro-preview'
  gemini_heavy_model:
    required: false
    description: 'Model to use for complex tasks such as code reviews.'
    default: 'gemini-3.1-pro-preview'
  gemini_model_temperature:
    required: false
    description: 'Temperature for Gemini model'
    default: '0.05'
  gemini_retries:
    required: false
    description:
      'How many times to retry Gemini API in case of timeouts or errors?'
    default: '5'
  gemini_timeout_ms:
    required: false
    description: 'Timeout for Gemini API call in millis'
    default: '360000'
  gemini_concurrency_limit:
    required: false
    description: 'How many concurrent API calls to make to Gemini servers?'
    default: '6'
  github_concurrency_limit:
    required: false
    description: 'How many concurrent API calls to make to GitHub?'
    default: '6'
  system_message:
    required: false
    description: 'System message to be sent to Gemini'
    default: |
      You are `@cicero-ai` (aka `github-actions[bot]`), a language model 
      powered by Google Gemini. Your purpose is to act as a highly experienced 
      software engineer and provide a thorough review of the code hunks
      and suggest code snippets to improve key areas such as:
        - Logic
        - Security
        - Performance
        - Data races
        - Consistency
        - Error handling
        - Maintainability
        - Modularity
        - Complexity
        - Optimization
        - Best practices: DRY, SOLID, KISS

      Do not comment on minor code style issues, missing 
      comments/documentation. Identify and resolve significant 
      concerns to improve overall code quality while deliberately 
      disregarding minor issues.
  summarize:
    required: false
    description: 'The prompt for final summarization response'
    default: |
      Provide your final response in markdown with the following content:

      - **Walkthrough**: A high-level summary of the overall change instead of 
        specific files within 80 words.
      - **Changes**: A markdown table of files and their summaries. Group files 
        with similar changes together into a single row to save space.
      - **Poem**: Below the changes, include a whimsical, short poem written by 
        a rabbit to celebrate the changes. Format the poem as a quote using 
        the ">" symbol and feel free to use emojis where relevant.

      Avoid additional commentary as this summary will be added as a comment on the 
      GitHub pull request. Use the titles "Walkthrough" and "Changes" and they must be H2.

  summarize_release_notes:
    required: false
    description:
      'The prompt for generating release notes in the same chat as summarize
      stage'
    default: |
      Craft concise release notes for the pull request. 
      Focus on the purpose and user impact, categorizing changes as "New Feature", "Bug Fix", 
      "Documentation", "Refactor", "Style", "Test", "Chore", or "Revert". Provide a bullet-point list, 
      e.g., "- New Feature: Added search functionality to the UI". Limit your response to 50-100 words 
      and emphasize features visible to the end-user while omitting code-level details.
  language:
    required: false
    description: ISO code for the response language
    default: en-US
  bot_icon:
    required: false
    description: 'The icon for the bot'
    default: '<img src="https://avatars.githubusercontent.com/in/347564?s=41" alt="Image description" width="20" height="20">'
  enable_test_coverage_analysis:
    required: false
    description: 'Enable automated test coverage analysis for changed files'
    default: 'true'
  test_coverage_threshold:
    required: false
    description: 'Minimum test coverage percentage threshold for warnings'
    default: '80'
  test_coverage_files:
    required: false
    description: 'Comma-separated list of test coverage report files to check'
    default: 'coverage/coverage-summary.json,coverage/lcov.info,coverage/clover.xml,test-results/coverage.json,coverage/coverage.json'
  enable_security_analysis:
    required: false
    description: 'Enable automated security vulnerability analysis for changed files'
    default: 'true'
  security_severity_threshold:
    required: false
    description: 'Minimum severity level for security vulnerabilities to report (low, medium, high, critical)'
    default: 'medium'
  enable_performance_analysis:
    required: false
    description: 'Enable automated performance impact assessment for changed files'
    default: 'true'
  performance_score_threshold:
    required: false
    description: 'Minimum performance score threshold for warnings (0-100)'
    default: '70'
  enable_complexity_analysis:
    required: false
    description: 'Enable automated code complexity analysis for changed files'
    default: 'true'
  complexity_score_threshold:
    required: false
    description: 'Minimum complexity score threshold for warnings (0-100)'
    default: '75'
  enable_dependency_analysis:
    required: false
    description: 'Enable automated dependency update intelligence analysis for changed files'
    default: 'true'
  dependency_security_threshold:
    required: false
    description: 'Minimum dependency security score threshold for warnings (0-100)'
    default: '80'
  enable_documentation_analysis:
    required: false
    description: 'Enable automated documentation quality validation for changed files'
    default: 'true'
  documentation_coverage_threshold:
    required: false
    description: 'Minimum documentation coverage score threshold for warnings (0-100)'
    default: '70'
  enable_cicd_analysis:
    required: false
    description: 'Enable automated CI/CD pipeline integration with quality gates'
    default: 'true'
  cicd_merge_blocking:
    required: false
    description: 'Enable merge blocking when quality gates fail'
    default: 'false'
  cicd_strict_mode:
    required: false
    description: 'Enable strict mode with higher quality thresholds'
    default: 'false'
  cicd_quality_gate_threshold:
    required: false
    description: 'CI/CD quality gate threshold (0-100)'
    default: '80'
  cicd_security_gate_threshold:
    required: false
    description: 'CI/CD security gate threshold (0-100)'
    default: '85'
  cicd_performance_gate_threshold:
    required: false
    description: 'CI/CD performance gate threshold (0-100)'
    default: '70'
  cicd_coverage_gate_threshold:
    required: false
    description: 'CI/CD test coverage gate threshold (0-100)'
    default: '80'
  cicd_complexity_gate_threshold:
    required: false
    description: 'CI/CD complexity gate threshold (0-100)'
    default: '75'
  cicd_dependency_gate_threshold:
    required: false
    description: 'CI/CD dependency gate threshold (0-100)'
    default: '80'
  cicd_documentation_gate_threshold:
    required: false
    description: 'CI/CD documentation gate threshold (0-100)'
    default: '70'
runs:
  using: 'node20'
  main: 'dist/index.js'
